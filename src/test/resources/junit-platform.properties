# Required for ArgumentsCaptor's automatic registration (see its javadoc) - this is OFF by default in
# JUnit Platform, and ArgumentsCaptor silently does nothing without it (no error, just an empty
# List<Object> from getArguments() - which is how a missing registration here once produced a
# confusing "wrong number of arguments" reflection failure downstream in ArtifactCollector-style usage).
junit.jupiter.extensions.autodetection.enabled=true
